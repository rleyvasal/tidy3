name: Tests

on:
  push:
    branches: [main, "expand-dplyr-parity"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tidy3
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q --tb=short --junitxml=test-results.xml -o junit_family=legacy
      - name: Upload tests and Polars timing ratios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-python-${{ matrix.python-version }}
          path: test-results.xml

  # The oldest supported setup: the oldest Python and exactly the lowest
  # Polars, pandas, and pyarrow that pyproject.toml allows, so the declared
  # floors stay true.
  pytest-oldest-dependencies:
    name: pytest (oldest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install tidy3 with its minimum Polars, pandas, and pyarrow
        run: |
          floor() { sed -n "s/^ *\"$1>=\([0-9.]*\)\".*/\1/p" pyproject.toml; }
          polars=$(floor polars); pandas=$(floor pandas); pyarrow=$(floor pyarrow)
          for version in "$polars" "$pandas" "$pyarrow"; do test -n "$version"; done
          # No NumPy pin: these pandas and pyarrow floors require NumPy 1
          # themselves, so pip installs what a user pinning them would get.
          python -m pip install -e ".[dev]" "polars==$polars" "pandas==$pandas" "pyarrow==$pyarrow"
          python -c "import polars, pandas, pyarrow, numpy; print('polars', polars.__version__, 'pandas', pandas.__version__, 'pyarrow', pyarrow.__version__, 'numpy', numpy.__version__)"
      - name: Run unit tests
        run: python -m pytest -q --tb=short

  # Optional semantic parity against real dplyr/tidyr. Skipped paths still
  # exercise classification invariants when R is absent; this job enforces
  # the full differential suite when R is available.
  r-oracle:
    name: R semantic oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Prebuilt Linux binaries from Posit Public Package Manager, cached
      # between runs, instead of compiling every package from source.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install tidyverse packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::jsonlite
            any::lubridate
            any::readr
            any::stringr
            any::forcats
            any::janitor
          cache: true
      - name: Install tidy3
        run: python -m pip install -e ".[dev]"
      - name: Run R oracle parity tests
        # All cases run in one R process; see tests/r_oracle_cases.R.
        run: python -m pytest -q --tb=short tests/test_r_oracle_parity.py tests/test_dplyr_semantic_parity.py
