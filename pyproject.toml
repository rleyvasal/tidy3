[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy3"
dynamic = ["version"]
description = "dplyr-style lazy data manipulation on Polars, with R-like partial pipeline run"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rigoberto Leyva Salmeron" }]
keywords = ["dplyr", "polars", "dataframe", "tidyverse", "lazy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "polars>=1.42.1",
  "pyarrow>=15.0",
  # 0.9 declares plot3's tidy3syntax entry point, which gives a cell that
  # imports plot3 its masking and nb_export plot3's syntax.
  "plot3>=0.9.0",
  "xlsxwriter>=3.0",
  # Polars serializes plans with Python steps through cloudpickle;
  # to_polars_code() reads those plans.
  "cloudpickle>=2.0",
  # The notebook syntax tidy3, tidy3a, plot3 and stats3 share (`!`, keywords
  # before positional arguments, `left ~ right` rules, backtick names).
  # Standard library only.
  "tidy3syntax>=0.2,<0.3",
]

[project.optional-dependencies]
# pandas input and output: tidy(pandas_frame), collect(as_="pandas"),
# pull(name=), pandas sheets in write_excel(), and the eager fct_*()
# functions' pandas Categorical results.
pandas = [
  "pandas>=2.1.4",
]
dev = ["pytest>=7.0", "ipython>=8.0", "tidy3[pandas]"]
excel = ["fastexcel>=0.10"]
# frame.to_spark(): run a pipeline on Spark. Spark also needs Java 17 or later.
spark = ["pyspark>=4.0"]

# A notebook cell that imports tidy3 gets its syntax in that same cell
# (its dialect names the notebook loader tidy3syntax's coordinator calls).
[project.entry-points."tidy3syntax.dialects"]
tidy3 = "tidy3.masking:dialect"

[project.urls]
Homepage = "https://github.com/rleyvasal/tidy3"
Changelog = "https://github.com/rleyvasal/tidy3/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "tidy3.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tidy3 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "r_oracle: compares results with R; deselect with -m 'not r_oracle' for a fast run",
]

# Pylance / Pyright: understand tidy3 >> pipes without notebook workarounds.
[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
# Expr uses rich operator overloading; keep comparisons usable in filters.
reportUnnecessaryComparison = false

[tool.basedpyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "basic"