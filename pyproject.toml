[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy3"
version = "0.1.4"
description = "dplyr-style lazy data manipulation on Polars, with R-like partial pipeline run"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rleyvasal" }]
keywords = ["dplyr", "polars", "dataframe", "tidyverse", "lazy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "polars>=1.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
jupyter = ["ipython>=8.0"]
plot3 = []  # plot3 is optional external; bridge imports if present

[project.urls]
Homepage = "https://github.com/rleyvasal/tidy3"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
